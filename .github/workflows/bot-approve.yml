name: Bot Auto-Approve

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

jobs:
    auto-approve:
        name: Approve PR if CI passed
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'

        permissions:
            contents: read
            pull-requests: write

        steps:
            - name: Resolve PR context
              id: pr
              env:
                  GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
              run: |
                  PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
                  if [ -z "$PR_NUMBER" ]; then
                    echo "No pull request is linked to this workflow_run."
                    exit 0
                  fi

                  PR_JSON=$(gh pr view "$PR_NUMBER" \
                    --repo "${{ github.repository }}" \
                    --json state,baseRefName,author,reviewDecision \
                    --jq '.')

                  echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
                  echo "pr_state=$(echo "$PR_JSON" | jq -r '.state')" >> "$GITHUB_OUTPUT"
                  echo "pr_base=$(echo "$PR_JSON" | jq -r '.baseRefName')" >> "$GITHUB_OUTPUT"
                  echo "pr_author=$(echo "$PR_JSON" | jq -r '.author.login')" >> "$GITHUB_OUTPUT"
                  echo "review_decision=$(echo "$PR_JSON" | jq -r '.reviewDecision // \"REVIEW_REQUIRED\"')" >> "$GITHUB_OUTPUT"

            - name: Approve PR
              if: |
                  steps.pr.outputs.pr_number != '' &&
                  steps.pr.outputs.pr_state == 'OPEN' &&
                  steps.pr.outputs.pr_base == 'master' &&
                  steps.pr.outputs.pr_author == 'principalwater' &&
                  steps.pr.outputs.review_decision != 'APPROVED'
              env:
                  GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
              run: |
                  PR_NUMBER=${{ steps.pr.outputs.pr_number }}
                  echo "Approving PR #${PR_NUMBER} by principalwater"
                  gh api repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews \
                    --method POST \
                    --input - <<'EOF'
                  {"event":"APPROVE","body":"CI passed: auto-approved by elementary-flow-bot."}
                  EOF
